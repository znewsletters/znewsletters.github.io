<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d2638">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Zara's Personal Chef</title>

  <style>
    :root {
      --burgundy: #6d2638;
      --burgundy-dark: #4d1727;
      --burgundy-light: #8b4053;
      --olive: #687052;
      --olive-light: #8b9270;
      --cream: #f8f3e9;
      --cream-dark: #eee5d5;
      --paper: #fffdf8;
      --ink: #302923;
      --muted: #756b63;
      --line: #ded4c5;
      --white: #ffffff;
      --success: #5f7048;
      --shadow: 0 12px 30px rgba(66, 42, 31, 0.09);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(139, 146, 112, 0.12), transparent 32%),
        radial-gradient(circle at top right, rgba(109, 38, 56, 0.09), transparent 30%),
        var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding-bottom: 110px;
    }

    .hero {
      padding: 28px 18px 20px;
      text-align: center;
    }

    .hero-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .hero h1 {
      margin: 0;
      color: var(--burgundy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 8vw, 48px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .hero p {
      margin: 10px auto 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      max-width: 440px;
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px 12px;
      background: rgba(248, 243, 233, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(222, 212, 197, 0.7);
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px 6px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .tab.active {
      background: var(--burgundy);
      color: var(--white);
      box-shadow: 0 5px 14px rgba(109, 38, 56, 0.22);
    }

    main {
      padding: 8px 14px 0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin: 16px 4px 14px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      color: var(--burgundy-dark);
    }

    .section-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(222, 212, 197, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 800;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:active {
      transform: scale(0.97);
    }

    .button.primary {
      background: var(--burgundy);
      color: var(--white);
    }

    .button.secondary {
      background: var(--cream-dark);
      color: var(--burgundy-dark);
    }

    .button.olive {
      background: var(--olive);
      color: var(--white);
    }

    .button.danger {
      background: #f3dddd;
      color: #8a2633;
    }

    .button.small {
      padding: 9px 12px;
      font-size: 13px;
    }

    .button.full {
      width: 100%;
    }

    .summary-card {
      padding: 18px;
      margin-bottom: 16px;
    }

    .summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .summary-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      color: var(--burgundy);
      font-weight: 700;
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
    }

    .progress-track {
      height: 9px;
      background: var(--cream-dark);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--olive);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .shopping-list {
      display: grid;
      gap: 10px;
    }

    .shopping-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: 0.2s ease;
    }

    .shopping-item.checked {
      opacity: 0.55;
    }

    .shopping-item.checked .ingredient-name {
      text-decoration: line-through;
    }

    .shopping-item input {
      width: 21px;
      height: 21px;
      accent-color: var(--olive);
    }

    .ingredient-name {
      font-weight: 700;
    }

    .ingredient-quantity {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      max-width: 130px;
    }

    .empty-state {
      padding: 34px 20px;
      text-align: center;
      margin-top: 14px;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .empty-state h3 {
      margin: 0 0 7px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--burgundy-dark);
      font-size: 23px;
    }

    .empty-state p {
      margin: 0 auto 18px;
      color: var(--muted);
      max-width: 400px;
      line-height: 1.5;
      font-size: 14px;
    }

    /* Weekly planner */

    .week-actions {
      display: flex;
      justify-content: flex-end;
      margin: 4px 0 12px;
    }

    .days {
      display: grid;
      gap: 14px;
    }

    .day-card {
      overflow: hidden;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 17px;
      background: linear-gradient(135deg, rgba(109, 38, 56, 0.08), rgba(104, 112, 82, 0.08));
      border-bottom: 1px solid var(--line);
    }

    .day-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--burgundy-dark);
    }

    .day-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .slot {
      display: grid;
      grid-template-columns: 44px 1fr 36px;
      align-items: center;
      gap: 10px;
      min-height: 82px;
      padding: 13px 15px;
      background: var(--paper);
      border: 0;
      border-bottom: 1px solid var(--line);
      width: 100%;
      text-align: left;
      color: var(--ink);
    }

    .slot:last-child {
      border-bottom: 0;
    }

    .slot:active {
      background: var(--cream);
    }

    .slot-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: var(--cream-dark);
      border-radius: 13px;
      font-size: 20px;
    }

    .slot-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 3px;
    }

    .slot-meal {
      font-weight: 800;
      font-size: 15px;
    }

    .slot-empty {
      color: #9b9188;
      font-weight: 600;
    }

    .slot-arrow {
      color: var(--burgundy);
      font-size: 21px;
      text-align: center;
    }

    /* Meals */

    .meal-grid {
      display: grid;
      gap: 14px;
    }

    .meal-card {
      padding: 17px;
    }

    .meal-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .meal-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      color: var(--burgundy-dark);
    }

    .category-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 9px;
      border-radius: 99px;
      background: #ececdf;
      color: var(--olive);
      font-size: 11px;
      font-weight: 800;
    }

    .meal-meta {
      color: var(--muted);
      font-size: 13px;
      margin: 11px 0 13px;
    }

    .meal-actions {
      display: flex;
      gap: 8px;
    }

    .meal-actions .button {
      flex: 1;
    }

    /* Modal */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      background: rgba(40, 25, 20, 0.45);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 760px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--paper);
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: 0 -15px 50px rgba(30, 18, 14, 0.2);
      animation: slideUp 0.22s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      margin: 0;
      color: var(--burgundy-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
    }

    .close-button {
      border: 0;
      background: var(--cream-dark);
      color: var(--burgundy-dark);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
      color: var(--burgundy-dark);
    }

    .input,
    .select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 13px;
      padding: 12px 13px;
      outline: none;
    }

    .input:focus,
    .select:focus {
      border-color: var(--burgundy-light);
      box-shadow: 0 0 0 3px rgba(109, 38, 56, 0.09);
    }

    .ingredients-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }

    .ingredients-header h3 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--burgundy-dark);
      font-size: 19px;
    }

    .ingredient-row {
      display: grid;
      grid-template-columns: 1fr 0.65fr 0.6fr 38px;
      gap: 6px;
      margin-bottom: 8px;
    }

    .remove-ingredient {
      border: 0;
      background: #f4e1e1;
      color: #8b2e3c;
      border-radius: 11px;
      font-size: 17px;
    }

    .modal-actions {
      display: flex;
      gap: 9px;
      margin-top: 20px;
    }

    .modal-actions .button {
      flex: 1;
    }

    .picker-list {
      display: grid;
      gap: 9px;
    }

    .picker-meal {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 15px;
      padding: 14px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .picker-meal:hover {
      border-color: var(--burgundy-light);
    }

    .picker-meal-name {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      color: var(--burgundy-dark);
      font-size: 17px;
    }

    .picker-meal-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .picker-arrow {
      color: var(--burgundy);
      font-size: 21px;
    }

    .picker-clear {
      margin-top: 12px;
    }

    @media (min-width: 700px) {
      .app {
        padding-bottom: 50px;
      }

      .hero {
        padding-top: 42px;
      }

      .tabs {
        border-radius: 18px;
        margin: 0 14px 10px;
        border: 1px solid var(--line);
      }

      .modal-backdrop {
        align-items: center;
        padding: 20px;
      }

      .modal {
        border-radius: 26px;
        max-height: 88vh;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="hero">
      <div class="hero-icon">🍷🍝</div>
      <h1>Zara's Personal Chef</h1>
      <p>A little kitchen, entirely yours.</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-screen="shopping">🛒 Shopping</button>
      <button class="tab" data-screen="week">📅 This Week</button>
      <button class="tab" data-screen="meals">📖 My Meals</button>
    </nav>

    <main>

      <!-- SHOPPING -->
      <section id="shopping" class="screen active">
        <div class="section-heading">
          <div>
            <h2>Shopping List</h2>
            <p>Everything you need for this week's meals.</p>
          </div>
        </div>

        <div id="shoppingContent"></div>
      </section>

      <!-- THIS WEEK -->
      <section id="week" class="screen">
        <div class="section-heading">
          <div>
            <h2>This Week</h2>
            <p>Plan your lunches and dinners from Monday to Sunday.</p>
          </div>
        </div>

        <div class="week-actions">
          <button class="button secondary small" id="clearWeekButton">
            Clear Week
          </button>
        </div>

        <div id="weekContent"></div>
      </section>

      <!-- MY MEALS -->
      <section id="meals" class="screen">
        <div class="section-heading">
          <div>
            <h2>My Meals</h2>
            <p>Your personal recipe collection.</p>
          </div>
          <button class="button primary small" id="addMealButton">+ Add Meal</button>
        </div>

        <div id="mealsContent"></div>
      </section>

    </main>
  </div>

  <!-- MEAL EDITOR MODAL -->
  <div class="modal-backdrop" id="mealModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mealModalTitle">
      <div class="modal-header">
        <h2 id="mealModalTitle">Add a Meal</h2>
        <button class="close-button" id="closeMealModal" aria-label="Close">×</button>
      </div>

      <form id="mealForm">
        <input type="hidden" id="editingMealId">

        <div class="form-group">
          <label for="mealName">Meal name</label>
          <input
            class="input"
            id="mealName"
            type="text"
            placeholder="Chicken pasta"
            required
          >
        </div>

        <div class="form-group">
          <label for="mealCategory">Category</label>
          <select class="select" id="mealCategory">
            <option value="Dinner">Dinner</option>
            <option value="Lunch">Lunch</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Snack">Snack</option>
            <option value="Dessert">Dessert</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="ingredients-header">
          <h3>Ingredients</h3>
          <button type="button" class="button secondary small" id="addIngredientButton">
            + Ingredient
          </button>
        </div>

        <div id="ingredientRows"></div>

        <div class="modal-actions">
          <button type="button" class="button secondary" id="cancelMealButton">
            Cancel
          </button>
          <button type="submit" class="button primary">
            Save Meal
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MEAL PICKER MODAL -->
  <div class="modal-backdrop" id="pickerModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pickerModalTitle">
      <div class="modal-header">
        <h2 id="pickerModalTitle">Choose a Meal</h2>
        <button class="close-button" id="closePickerModal" aria-label="Close">×</button>
      </div>

      <div id="pickerList" class="picker-list"></div>

      <div class="picker-clear">
        <button class="button danger full" id="clearSlotButton">
          Clear This Slot
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "zaras-personal-chef-v1";

    const DAYS = [
      { key: "monday", label: "Monday" },
      { key: "tuesday", label: "Tuesday" },
      { key: "wednesday", label: "Wednesday" },
      { key: "thursday", label: "Thursday" },
      { key: "friday", label: "Friday" },
      { key: "saturday", label: "Saturday" },
      { key: "sunday", label: "Sunday" }
    ];

    const SLOTS = [
      { key: "lunch", label: "Lunch", icon: "☀️" },
      { key: "dinner", label: "Dinner", icon: "🌙" }
    ];

    function createEmptyWeek() {
      const week = {};

      DAYS.forEach(day => {
        week[day.key] = {
          lunch: null,
          dinner: null
        };
      });

      return week;
    }

    function createInitialState() {
      return {
        meals: [],
        weekPlan: createEmptyWeek(),
        checkedItems: []
      };
    }

    let state = loadState();
    let currentPickerSlot = null;

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

        if (!saved) {
          return createInitialState();
        }

        const loaded = {
          meals: Array.isArray(saved.meals) ? saved.meals : [],
          weekPlan: saved.weekPlan || createEmptyWeek(),
          checkedItems: Array.isArray(saved.checkedItems) ? saved.checkedItems : []
        };

        /*
          If an older version of the app had selectedMeals,
          place those meals into dinner slots so existing choices
          are not lost when moving to the new weekly planner.
        */
        if (!saved.weekPlan && Array.isArray(saved.selectedMeals)) {
          const dinnerDays = DAYS.map(day => day.key);

          saved.selectedMeals.forEach((mealId, index) => {
            if (index < dinnerDays.length) {
              loaded.weekPlan[dinnerDays[index]].dinner = mealId;
            }
          });
        }

        DAYS.forEach(day => {
          if (!loaded.weekPlan[day.key]) {
            loaded.weekPlan[day.key] = {
              lunch: null,
              dinner: null
            };
          }

          if (!("lunch" in loaded.weekPlan[day.key])) {
            loaded.weekPlan[day.key].lunch = null;
          }

          if (!("dinner" in loaded.weekPlan[day.key])) {
            loaded.weekPlan[day.key].dinner = null;
          }
        });

        return loaded;
      } catch (error) {
        return createInitialState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function makeId() {
      return "meal-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function findMeal(mealId) {
      return state.meals.find(meal => meal.id === mealId);
    }

    function countPlannedSlots() {
      let count = 0;

      DAYS.forEach(day => {
        SLOTS.forEach(slot => {
          if (state.weekPlan[day.key][slot.key]) {
            count++;
          }
        });
      });

      return count;
    }

    /* Navigation */

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        const screen = tab.dataset.screen;

        document.querySelectorAll(".tab").forEach(item => {
          item.classList.remove("active");
        });

        document.querySelectorAll(".screen").forEach(item => {
          item.classList.remove("active");
        });

        tab.classList.add("active");
        document.getElementById(screen).classList.add("active");

        renderCurrentScreen();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    function renderCurrentScreen() {
      renderShopping();
      renderWeek();
      renderMeals();
    }

    /* Shopping */

    function buildShoppingList() {
      const items = {};

      DAYS.forEach(day => {
        SLOTS.forEach(slot => {
          const mealId = state.weekPlan[day.key][slot.key];
          const meal = findMeal(mealId);

          if (!meal) return;

          meal.ingredients.forEach(ingredient => {
            const name = String(ingredient.name || "").trim();

            if (!name) return;

            const key = normalize(name);

            if (!items[key]) {
              items[key] = {
                name: name,
                quantities: []
              };
            }

            const parts = [];

            if (ingredient.quantity) {
              parts.push(String(ingredient.quantity).trim());
            }

            if (ingredient.unit) {
              parts.push(String(ingredient.unit).trim());
            }

            if (parts.length) {
              items[key].quantities.push(parts.join(" "));
            }
          });
        });
      });

      return Object.values(items);
    }

    function renderShopping() {
      const container = document.getElementById("shoppingContent");
      const items = buildShoppingList();
      const planned = countPlannedSlots();

      if (!planned) {
        container.innerHTML = `
          <div class="card empty-state">
            <div class="empty-icon">🛒</div>
            <h3>Your shopping list is waiting</h3>
            <p>
              Plan some meals in This Week and your combined ingredients
              will appear here automatically.
            </p>
            <button class="button primary" onclick="showScreen('week')">
              Plan This Week
            </button>
          </div>
        `;
        return;
      }

      const checkedCount = items.filter(item =>
        state.checkedItems.includes(normalize(item.name))
      ).length;

      const percentage = items.length
        ? Math.round((checkedCount / items.length) * 100)
        : 0;

      container.innerHTML = `
        <div class="card summary-card">
          <div class="summary-top">
            <div>
              <div class="summary-number">${checkedCount} / ${items.length}</div>
              <div class="summary-label">items collected</div>
            </div>

            <div style="text-align:right;">
              <div class="summary-number" style="font-size:24px;">${planned}</div>
              <div class="summary-label">meals planned</div>
            </div>
          </div>

          <div class="progress-track">
            <div class="progress-fill" style="width:${percentage}%"></div>
          </div>

          <button
            class="button secondary small"
            style="margin-top:14px;"
            onclick="resetShoppingChecks()"
          >
            Reset Checks
          </button>
        </div>

        <div class="shopping-list">
          ${items.map(item => {
            const key = normalize(item.name);
            const checked = state.checkedItems.includes(key);

            let quantityText = "";

            if (item.quantities.length) {
              const counts = {};

              item.quantities.forEach(quantity => {
                counts[quantity] = (counts[quantity] || 0) + 1;
              });

              quantityText = Object.entries(counts)
                .map(([quantity, count]) => {
                  return count > 1 ? `${quantity} × ${count}` : quantity;
                })
                .join(" + ");
            }

            return `
              <label class="shopping-item ${checked ? "checked" : ""}">
                <input
                  type="checkbox"
                  ${checked ? "checked" : ""}
                  onchange="toggleShoppingItem('${encodeURIComponent(key)}')"
                >

                <span class="ingredient-name">
                  ${escapeHTML(item.name)}
                </span>

                <span class="ingredient-quantity">
                  ${escapeHTML(quantityText)}
                </span>
              </label>
            `;
          }).join("")}
        </div>
      `;
    }

    function toggleShoppingItem(encodedKey) {
      const key = decodeURIComponent(encodedKey);

      if (state.checkedItems.includes(key)) {
        state.checkedItems = state.checkedItems.filter(item => item !== key);
      } else {
        state.checkedItems.push(key);
      }

      saveState();
      renderShopping();
    }

    function resetShoppingChecks() {
      state.checkedItems = [];
      saveState();
      renderShopping();
    }

    /* Weekly Planner */

    function renderWeek() {
      const container = document.getElementById("weekContent");
      const planned = countPlannedSlots();

      if (!state.meals.length) {
        container.innerHTML = `
          <div class="card empty-state">
            <div class="empty-icon">📖</div>
            <h3>Your meal collection is empty</h3>
            <p>
              Add a few favourite meals first, then come back here
              to build your week.
            </p>
            <button class="button primary" onclick="openMealModal()">
              Add Your First Meal
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="card summary-card">
          <div class="summary-top">
            <div>
              <div class="summary-number">${planned} / 14</div>
              <div class="summary-label">meal slots planned</div>
            </div>

            <div style="font-size:30px;">
              ${planned === 14 ? "✨" : "🍽️"}
            </div>
          </div>

          <div class="progress-track">
            <div
              class="progress-fill"
              style="width:${Math.round((planned / 14) * 100)}%"
            ></div>
          </div>
        </div>

        <div class="days">
          ${DAYS.map(day => renderDay(day)).join("")}
        </div>
      `;
    }

    function renderDay(day) {
      const lunchMeal = findMeal(state.weekPlan[day.key].lunch);
      const dinnerMeal = findMeal(state.weekPlan[day.key].dinner);

      const dayCount = [lunchMeal, dinnerMeal].filter(Boolean).length;

      return `
        <div class="card day-card">
          <div class="day-header">
            <div class="day-name">${day.label}</div>
            <div class="day-count">${dayCount} / 2 planned</div>
          </div>

          ${renderSlot(day, SLOTS[0], lunchMeal)}
          ${renderSlot(day, SLOTS[1], dinnerMeal)}
        </div>
      `;
    }

    function renderSlot(day, slot, meal) {
      const mealText = meal
        ? `
          <div class="slot-label">${slot.label}</div>
          <div class="slot-meal">${escapeHTML(meal.name)}</div>
        `
        : `
          <div class="slot-label">${slot.label}</div>
          <div class="slot-meal slot-empty">+ Add ${slot.label.toLowerCase()}</div>
        `;

      return `
        <button
          class="slot"
          onclick="openMealPicker('${day.key}', '${slot.key}')"
          aria-label="${meal ? "Change" : "Add"} ${slot.label} for ${day.label}"
        >
          <div class="slot-icon">${slot.icon}</div>
          <div>${mealText}</div>
          <div class="slot-arrow">›</div>
        </button>
      `;
    }

    function openMealPicker(dayKey, slotKey) {
      currentPickerSlot = {
        dayKey,
        slotKey
      };

      const container = document.getElementById("pickerList");

      container.innerHTML = state.meals.map(meal => `
        <button
          class="picker-meal"
          onclick="chooseMeal('${meal.id}')"
        >
          <div>
            <div class="picker-meal-name">${escapeHTML(meal.name)}</div>
            <div class="picker-meal-meta">
              ${escapeHTML(meal.category || "Meal")} ·
              ${meal.ingredients.length} ingredient${meal.ingredients.length === 1 ? "" : "s"}
            </div>
          </div>

          <div class="picker-arrow">›</div>
        </button>
      `).join("");

      document.getElementById("pickerModalBackdrop").classList.add("open");
    }

    function chooseMeal(mealId) {
      if (!currentPickerSlot) return;

      state.weekPlan[currentPickerSlot.dayKey][currentPickerSlot.slotKey] = mealId;

      saveState();
      closePickerModal();
      renderWeek();
      renderShopping();
    }

    function clearCurrentSlot() {
      if (!currentPickerSlot) return;

      state.weekPlan[currentPickerSlot.dayKey][currentPickerSlot.slotKey] = null;

      saveState();
      closePickerModal();
      renderWeek();
      renderShopping();
    }

    function clearWeek() {
      const confirmed = confirm(
        "Clear all lunches and dinners from this week?"
      );

      if (!confirmed) return;

      state.weekPlan = createEmptyWeek();
      state.checkedItems = [];

      saveState();
      renderWeek();
      renderShopping();
    }

    document
      .getElementById("clearWeekButton")
      .addEventListener("click", clearWeek);

    /* Meals */

    function renderMeals() {
      const container = document.getElementById("mealsContent");

      if (!state.meals.length) {
        container.innerHTML = `
          <div class="card empty-state">
            <div class="empty-icon">👩‍🍳</div>
            <h3>Your Recipe Book Is Waiting</h3>
            <p>
              Save your favourite meals here with their ingredients.
              You can then use them again and again when planning your week.
            </p>
            <button class="button primary" onclick="openMealModal()">
              + Add a Meal
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="meal-grid">
          ${state.meals.map(meal => `
            <article class="card meal-card">
              <div class="meal-card-top">
                <div>
                  <h3 class="meal-title">${escapeHTML(meal.name)}</h3>
                  <span class="category-badge">
                    ${escapeHTML(meal.category || "Other")}
                  </span>
                </div>

                <div style="font-size:28px;">🍴</div>
              </div>

              <div class="meal-meta">
                ${meal.ingredients.length}
                ingredient${meal.ingredients.length === 1 ? "" : "s"}
              </div>

              <div class="meal-actions">
                <button
                  class="button secondary small"
                  onclick="editMeal('${meal.id}')"
                >
                  Edit
                </button>

                <button
                  class="button danger small"
                  onclick="deleteMeal('${meal.id}')"
                >
                  Delete
                </button>
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    /* Meal Editor */

    function openMealModal(mealId = null) {
      const modal = document.getElementById("mealModalBackdrop");
      const title = document.getElementById("mealModalTitle");
      const nameInput = document.getElementById("mealName");
      const categoryInput = document.getElementById("mealCategory");
      const editingInput = document.getElementById("editingMealId");
      const rows = document.getElementById("ingredientRows");

      editingInput.value = mealId || "";

      if (mealId) {
        const meal = findMeal(mealId);

        if (!meal) return;

        title.textContent = "Edit Meal";
        nameInput.value = meal.name;
        categoryInput.value = meal.category || "Dinner";

        rows.innerHTML = "";

        meal.ingredients.forEach(ingredient => {
          addIngredientRow(
            ingredient.name,
            ingredient.quantity,
            ingredient.unit
          );
        });
      } else {
        title.textContent = "Add a Meal";
        nameInput.value = "";
        categoryInput.value = "Dinner";

        rows.innerHTML = "";
        addIngredientRow();
        addIngredientRow();
      }

      modal.classList.add("open");

      setTimeout(() => {
        nameInput.focus();
      }, 100);
    }

    function closeMealModal() {
      document.getElementById("mealModalBackdrop").classList.remove("open");
    }

    function addIngredientRow(name = "", quantity = "", unit = "") {
      const container = document.getElementById("ingredientRows");

      const row = document.createElement("div");
      row.className = "ingredient-row";

      row.innerHTML = `
        <input
          class="input ingredient-name-input"
          type="text"
          placeholder="Ingredient"
          value="${escapeHTML(name)}"
        >

        <input
          class="input ingredient-quantity-input"
          type="text"
          placeholder="Qty"
          value="${escapeHTML(quantity)}"
        >

        <input
          class="input ingredient-unit-input"
          type="text"
          placeholder="Unit"
          value="${escapeHTML(unit)}"
        >

        <button
          type="button"
          class="remove-ingredient"
          aria-label="Remove ingredient"
        >
          ×
        </button>
      `;

      row.querySelector(".remove-ingredient").addEventListener("click", () => {
        row.remove();
      });

      container.appendChild(row);
    }

    function editMeal(mealId) {
      openMealModal(mealId);
    }

    function deleteMeal(mealId) {
      const meal = findMeal(mealId);

      if (!meal) return;

      const confirmed = confirm(
        `Delete "${meal.name}" from your meals?`
      );

      if (!confirmed) return;

      state.meals = state.meals.filter(item => item.id !== mealId);

      DAYS.forEach(day => {
        SLOTS.forEach(slot => {
          if (state.weekPlan[day.key][slot.key] === mealId) {
            state.weekPlan[day.key][slot.key] = null;
          }
        });
      });

      saveState();
      renderMeals();
      renderWeek();
      renderShopping();
    }

    document
      .getElementById("mealForm")
      .addEventListener("submit", event => {
        event.preventDefault();

        const name = document.getElementById("mealName").value.trim();
        const category = document.getElementById("mealCategory").value;
        const editingId = document.getElementById("editingMealId").value;

        const ingredients = [];

        document
          .querySelectorAll("#ingredientRows .ingredient-row")
          .forEach(row => {
            const ingredientName = row
              .querySelector(".ingredient-name-input")
              .value
              .trim();

            const quantity = row
              .querySelector(".ingredient-quantity-input")
              .value
              .trim();

            const unit = row
              .querySelector(".ingredient-unit-input")
              .value
              .trim();

            if (ingredientName) {
              ingredients.push({
                name: ingredientName,
                quantity,
                unit
              });
            }
          });

        if (!name) {
          alert("Please enter a meal name.");
          return;
        }

        if (!ingredients.length) {
          alert("Please add at least one ingredient.");
          return;
        }

        if (editingId) {
          const meal = findMeal(editingId);

          if (meal) {
            meal.name = name;
            meal.category = category;
            meal.ingredients = ingredients;
          }
        } else {
          state.meals.push({
            id: makeId(),
            name,
            category,
            ingredients
          });
        }

        saveState();
        closeMealModal();
        renderMeals();
        renderWeek();
        renderShopping();
      });

    document
      .getElementById("addIngredientButton")
      .addEventListener("click", () => {
        addIngredientRow();
      });

    document
      .getElementById("addMealButton")
      .addEventListener("click", () => {
        openMealModal();
      });

    document
      .getElementById("closeMealModal")
      .addEventListener("click", closeMealModal);

    document
      .getElementById("cancelMealButton")
      .addEventListener("click", closeMealModal);

    /* Picker Modal */

    function closePickerModal() {
      document
        .getElementById("pickerModalBackdrop")
        .classList.remove("open");

      currentPickerSlot = null;
    }

    document
      .getElementById("closePickerModal")
      .addEventListener("click", closePickerModal);

    document
      .getElementById("clearSlotButton")
      .addEventListener("click", clearCurrentSlot);

    /* Close modals when clicking the backdrop */

    document
      .getElementById("mealModalBackdrop")
      .addEventListener("click", event => {
        if (event.target.id === "mealModalBackdrop") {
          closeMealModal();
        }
      });

    document
      .getElementById("pickerModalBackdrop")
      .addEventListener("click", event => {
        if (event.target.id === "pickerModalBackdrop") {
          closePickerModal();
        }
      });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeMealModal();
        closePickerModal();
      }
    });

    /* Screen helper */

    function showScreen(screenName) {
      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle(
          "active",
          tab.dataset.screen === screenName
        );
      });

      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.toggle(
          "active",
          screen.id === screenName
        );
      });

      renderCurrentScreen();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* Initial render */

    renderCurrentScreen();
  </script>
</body>
</html>
